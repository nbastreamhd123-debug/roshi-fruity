backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
    - name: "posts"
    label: "Meri Posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Paragraph", name: "body", widget: "markdown"}
            - {label: "Image", name: "image", widget: "image"}
