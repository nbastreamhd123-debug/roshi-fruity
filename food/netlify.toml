[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/ads.txt"
  to = "/ads.txt"
  status = 200
  force = true
[[edge_functions]]
function = "og"
path = "/*"
